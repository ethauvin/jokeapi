version: 2.1

commands:
  build_and_test:
    parameters:
      reports-dir:
        type: string
        default: "build/reports/test_results"
    steps:
      - checkout
      - restore_cache:
          key: bld-lib-{{ arch }}-{{ .Environment.CIRCLE_JOB }}
      - run:
          name: Compile source
          command: ./bld clean compile
      - save_cache:
          key: bld-lib-{{ arch }}-{{ .Environment.CIRCLE_JOB }}
          paths:
            - lib
      - run:
          name: Run tests
          command: ./bld jacoco
      - run:
          name: Run reporter
          when: on_fail
          command: ./bld --offline reporter --all
      - store_test_results:
          path: << parameters.reports-dir >>
      - store_artifacts:
          path: build/reports/jacoco/test/html

jobs:
  bld_jdk17:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - build_and_test

  bld_jdk21:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - build_and_test

workflows:
  bld:
    jobs:
      - bld_jdk17
      - bld_jdk21
